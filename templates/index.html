<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de PNJs - Icewind Dale</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1b2a;
            color: #e0e1dd;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background-color: #1b263b;
            border: 2px solid #415a77;
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 {
            color: #778da9;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0;
            text-align: center;
        }
        .nombre {
            font-size: 2rem;
            color: #e0e1dd;
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #415a77;
            padding-bottom: 10px;
        }
        p {
            margin: 12px 0;
            line-height: 1.5;
        }
        strong {
            color: #778da9;
        }
        .btn {
            display: block;
            width: 100%;
            background-color: #415a77;
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 25px;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #778da9;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Superviviente de la Tundra</h1>
        <div class="nombre">{{ pnj.nombre }}</div>
        
        <p><strong>Raza:</strong> {{ pnj.raza }}</p>
        <p><strong>Oficio:</strong> {{ pnj.oficio }}</p>
        <p><strong>Personalidad:</strong> {{ pnj.personalidad }}</p>
        <p><strong>Rasgo / Tic:</strong> {{ pnj.tic }}</p>
        <p><strong>Intención:</strong> {{ pnj.intencion }}</p>
        <p><strong>Información / Secreto:</strong> {{ pnj.informacion }}</p>

        <a href="/" class="btn">Generar otro PNJ</a>
    </div>

</body>
</html>
